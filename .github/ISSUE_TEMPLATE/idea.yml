name: An idea, or a source we should carry
description: Something the service should be able to answer, or a flag the bridge should have.
title: "idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two things worth knowing before you write, because they decide whether an
        idea is actionable here:

        - **A new data source has to be licensed before it can be built.** If you
          are proposing one, a link to its terms is the most useful thing in the
          issue. [SOURCES.md](https://github.com/mavrovde/viafrei-bridge/blob/main/SOURCES.md) shows the shape of what
          we can accept.
        - **The tool catalogue lives on the server, whose source is closed.** An
          idea for a new tool is still welcome here - this repository is the
          address for it - it just will not be implemented in this repository.
  - type: textarea
    id: want
    attributes:
      label: What you want to be able to ask, or to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you are building, and why this blocks it
      description: Not a formality. The difference between a tool that is used and one that is not is usually here.
  - type: input
    id: source
    attributes:
      label: If this needs a data source, where are its terms?
      placeholder: https://example.invalid/terms-of-use
