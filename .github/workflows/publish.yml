name: Publish

# Tag-driven publish to npm with provenance, via npm Trusted Publishing.
#
# There is no token and no OTP anywhere in this file, and there must never be
# one: the OIDC exchange is the credential. Configure the trusted publisher on
# the npm package as `mavrovde/viafrei-bridge` + `.github/workflows/publish.yml`
# before the first run.
#
# The publish-hygiene gate runs BEFORE the publish step, against the tarball
# that is about to be uploaded. The order is the point - a gate that runs after
# the upload is a report, not a gate, and npm versions are immutable.
#
# Triggered only by a tag the owner pushes. Nothing here runs on a branch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for provenance and Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # A deployment environment gives the owner a place to hang an approval on,
    # and npm can be told to require it. If the trusted publisher on npm is
    # configured WITHOUT an environment, delete this line - the two must agree,
    # or the OIDC claim will not match and the publish will be refused.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing needs a recent npm CLI; the one bundled with Node
      # may predate it.
      - name: Use an npm that can do Trusted Publishing
        run: npm install -g npm@latest --ignore-scripts

      # --ignore-scripts: no dependency's install hook runs in a job that can
      # build or publish this package. The gate refuses a lifecycle script in
      # OUR manifest; this is the same rule applied to everyone else's.
      - run: npm ci --ignore-scripts

      - name: The tag and the manifest must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm test

      - name: Repository leak sweep
        run: node scripts/check-leaks.mjs --history

      - name: Publish-hygiene gate self-test
        run: npm run test:gate

      - name: Publish-hygiene gate on the tarball about to be published
        run: npm run check:tarball

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --provenance --access public

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --provenance --access public --dry-run
