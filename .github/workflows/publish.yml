name: Publish

# Tag-driven publish to npm with provenance, via npm Trusted Publishing.
#
# There is no token and no OTP anywhere in this file, and there must never be
# one: the OIDC exchange is the credential. Configure the trusted publisher on
# the npm package as `mavrovde/viafrei-bridge` + `.github/workflows/publish.yml`
# before the first run.
#
# The publish-hygiene gate runs BEFORE the publish step, against the tarball
# that is about to be uploaded. The order is the point - a gate that runs after
# the upload is a report, not a gate, and npm versions are immutable.
#
# Triggered only by a tag the owner pushes. Nothing here runs on a branch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for provenance and Trusted Publishing

env:
  # The npm CLI this pipeline publishes with. PINNED, and it stays pinned.
  #
  # This step used to install `npm@latest`, which made the outcome of a release
  # depend on the day it ran rather than on anything committed here. On
  # 2026-09-21 that bill came due: npm 12 was `latest`, and npm 12 changed
  # `npm pack --json` from an array to an object keyed by package name - a
  # deliberate major-version change, announced in npm's own source (npm 11's
  # lib/commands/pack.js: "XXX(BREAKING_CHANGE): publish outputs a json object
  # with package names as keys. Pack should do the same here instead of an
  # array"). The job broke with no commit in this repository.
  #
  # 12.0.2 is chosen because it is what `latest` resolves to today, so pinning
  # it changes nothing about the run except that tomorrow's run is the same as
  # today's; it has lib/utils/oidc.js and so can do Trusted Publishing; and its
  # `npm pack --json` shape is one of the two scripts/npm-pack-json.mjs reads.
  #
  # Before bumping this pin, in the same commit:
  #   1. run `npm run test:gate` against the new npm (install it into a temp
  #      prefix, do not change the machine's npm) - it proves the reader
  #      handles what that npm prints, and the reader refuses with one line if
  #      npm has invented a third shape;
  #   2. check the new npm still has lib/utils/oidc.js, i.e. it can still
  #      exchange a GitHub OIDC token for a publish credential without a token
  #      in this file;
  #   3. rehearse with the workflow_dispatch dry run before spending a tag.
  NPM_VERSION: '12.0.2'

jobs:
  publish:
    runs-on: ubuntu-latest
    # A deployment environment gives the owner a place to hang an approval on,
    # and npm can be told to require it. If the trusted publisher on npm is
    # configured WITHOUT an environment, delete this line - the two must agree,
    # or the OIDC claim will not match and the publish will be refused.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing needs a recent npm CLI; the one bundled with Node
      # may predate it. Which one is decided above, by NPM_VERSION, and the
      # install is ASSERTED rather than assumed: a pin nobody checks is a
      # comment, and this whole step exists because a version nobody checked
      # changed underneath a release.
      - name: Use the pinned npm that can do Trusted Publishing
        run: |
          set -eu
          npm install -g "npm@${NPM_VERSION}" --ignore-scripts
          installed="$(npm --version)"
          echo "npm ${installed} (pinned ${NPM_VERSION})"
          if [ "${installed}" != "${NPM_VERSION}" ]; then
            echo "Pinned npm ${NPM_VERSION} but npm --version says ${installed}." >&2
            exit 1
          fi

      # --ignore-scripts: no dependency's install hook runs in a job that can
      # build or publish this package. The gate refuses a lifecycle script in
      # OUR manifest; this is the same rule applied to everyone else's.
      - run: npm ci --ignore-scripts

      - name: The tag and the manifest must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm test

      - name: Repository leak sweep
        run: node scripts/check-leaks.mjs --history

      - name: Publish-hygiene gate self-test
        run: npm run test:gate

      # Packed ONCE, here, and that exact file is what the gate reads and what
      # npm uploads. `npm run check:tarball` used to pack its own copy and
      # `npm publish` then packed another, so the artefact that was checked
      # was never the artefact that shipped - two builds of the same tree,
      # believed identical. They almost always are; "almost" is the whole
      # reason this gate exists.
      - name: Pack the tarball
        id: pack
        #
        # The filename comes out of scripts/npm-pack-json.mjs, which is the one
        # reader for `npm pack --json` in this repository. It used to be an
        # inline `JSON.parse(s)[0].filename` here and a second hand-rolled
        # parse in each of the two gates - three copies of an assumption about
        # a format none of them owns. The reader knows both shapes npm has
        # printed and exits 2 with one sentence when it is handed a third.
        run: |
          set -eu
          file="$(npm pack --json | node scripts/npm-pack-json.mjs)"
          test -f "$file"
          echo "tarball=$PWD/$file" >> "$GITHUB_OUTPUT"

      - name: Publish-hygiene gate on the tarball about to be published
        run: npm run check:tarball -- "${{ steps.pack.outputs.tarball }}"

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --provenance --access public "${{ steps.pack.outputs.tarball }}"

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --provenance --access public --dry-run "${{ steps.pack.outputs.tarball }}"
