name: CI

# Build, offline tests, and the checks that keep this repository and the
# published tarball free of anything belonging to the closed platform --
# including the self-tests of those checks, which are the only thing standing
# between a gate and a gate that has quietly stopped reading anything.
#
# Nothing here contacts the public MCP endpoint or any data provider. The tests
# start their own stub server; the network is not part of the contract.

on:
  # `main` on push, everything else through its pull request. Both triggers used to fire
  # for a branch with an open PR, so one push ran the whole matrix TWICE (#23).
  #
  # The cost of this shape, named rather than discovered later: a branch pushed with no
  # pull request gets no CI. That is the right trade here - this repository's flow is
  # push-then-open-immediately, the reviewer reads local commits before the push, and
  # the publish workflow re-runs every gate against the tag regardless.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned, not `ubuntu-latest`. That label becomes Ubuntu 26 from 2026-10-19, and a
    # runner image that changes under a workflow is a change nobody reviewed. publish.yml
    # already pins this image, so pinning here also stops the push gate and the publish
    # gate drifting onto different operating systems.
    runs-on: ubuntu-24.04
    # Observed: a successful build-and-test job is ~100 s. Fifteen minutes is nine
    # times that, so it never fires on a slow-but-working run - and it ends a HUNG
    # one in minutes. On 2026-09-28 the Node 24 job of this workflow stopped
    # returning inside the gate self-test and ran 1 h 49 min before being cancelled
    # by hand, because GitHub's default is six hours (#25).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The leak sweep reads history; a shallow clone cannot answer what is
          # in it, and a check that cannot run has not passed.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: no dependency's install hook runs in a job that can
      # build or publish this package. The gate refuses a lifecycle script in
      # OUR manifest; this is the same rule applied to everyone else's.
      - run: npm ci --ignore-scripts

      # FIRST, because `npm ci` above does not compare the root `version` field and
      # nothing else here reads that pair (#18). Its home is this workflow rather than
      # only publish.yml so the drift surfaces on the push that introduces it, not at
      # the tag - when the only remedy is a new version.
      - name: Manifest and lockfile versions agree
        run: npm run check:versions

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm test

      - name: Publish-hygiene gate (built tarball)
        run: npm run check:tarball

      - name: Publish-hygiene gate self-test (poisoned tarballs)
        run: npm run test:gate

      - name: Repository leak sweep (working tree and history)
        run: node scripts/check-leaks.mjs --history

      - name: Leak-sweep scope self-test
        run: npm run test:leaks

      # Also the sweep that keeps every spawned program coming from
      # scripts/tools.mjs rather than from $PATH (javascript:S4036).
      - name: Tool-resolution self-test
        run: npm run test:tools

      # API.md is generated from catalogue.json. This fails if either was edited
      # without the other, which is the only drift a gate can catch here - the
      # snapshot ageing against the live server is a dated fact, not a defect.
      - name: API reference matches the catalogue snapshot
        run: npm run check:docs

      # The drift check above compares the document to the snapshot. This one checks
      # the GENERATOR's own claims against inputs the snapshot does not contain -
      # which is where its whitespace bug lived, invisible to a byte comparison.
      - name: API-reference generator self-test
        run: npm run test:docs

      # SOURCES.md states counts ABOUT THE SERVER - how many tools, how many read-only,
      # which are fuel and therefore excluded from its spot check. Nothing compared them
      # with the snapshot, and the page spent two releases describing a server it no
      # longer matched. The unnamed fuel tool was the serious half: that exclusion is an
      # MTS-K licence condition, not a convenience (#32).
      #
      # Offline on purpose. Both files already ship together, so this needs no network
      # and belongs on every push rather than at the cut. The snapshot's currency against
      # the RUNNING server is the other half and cannot be a CI step (#33).
      - name: Sources page agrees with the catalogue snapshot
        run: npm run check:sources

      # And the proof it can say no, including the three defects it exists for - a stale
      # count, an unnamed fuel tool, and a derived call count that disagrees with
      # read-only minus the excluded tools.
      - name: Sources-consistency self-test
        run: npm run test:sources

      # The cut-time probe compares the snapshot with the RUNNING server, so it is the
      # one script here that makes a network call and it is deliberately NOT a CI step
      # (#33) - this repository's whole test posture is that CI reaches nothing.
      #
      # Its SELF-TEST is offline: every case runs against a local stub on loopback, so
      # the thing CI can check is that the probe can still say no - and in particular
      # that it tells a snapshot that is WRONG about the server from one that is merely
      # DATED, which are the two real histories and need different remedies.
      - name: Cut-time probe self-test (offline, against a local stub)
        run: npm run test:probe

      # The freshness probe runs on a SCHEDULE, not here - it asks prod, and a
      # contributor's push must not depend on the service being up. What belongs here
      # is its self-test, which is hermetic: a STALE payload the healthy endpoint
      # cannot produce, so this is the only place the staleness verdict is ever
      # exercised. A monitor whose verdict is never proved reports success about a
      # dead service just as convincingly as about a live one.
      - name: Freshness probe self-test (offline, against a local stub)
        run: npm run test:freshness

      # The version gate above compares three fields. This proves it can say NO, with
      # the mutant #18 asks for, and that "could not read the lockfile" (exit 2) never
      # looks like "read it and was satisfied" (exit 0).
      - name: Version-gate self-test
        run: npm run test:versions

      # The public endpoint may be *asserted about* - one test checks that the
      # default really is it - but it may never be handed to something that
      # connects. Any occurrence outside an assertion fails the build.
      - name: No test may connect to the public endpoint
        run: |
          set -u
          # The directory has to exist and the grep has to run. Without this,
          # an empty or renamed test/ - or a grep that errors - reaches the
          # `|| true` below and reports success having read nothing, which is
          # the failure every other check here refuses.
          if [ ! -d test ]; then
            echo "test/ does not exist, so this check read nothing" >&2
            exit 2
          fi
          hits="$(grep -rn 'mcp\.viafrei\.de' test/ || true)"
          count="$(printf '%s' "$hits" | grep -c . || true)"
          echo "occurrences in test/: ${count}"
          echo "${hits:-  (none)}"
          # Exactly one occurrence is legitimate: the assertion that the
          # default URL really is the public endpoint. Zero means the
          # assertion was deleted or this check stopped finding it - either
          # way it is no longer checking what it claims to.
          if [ "$count" -lt 1 ]; then
            echo "expected the one assertion about the default URL and found none - this check has read nothing" >&2
            exit 2
          fi
          offenders="$(printf '%s\n' "$hits" | grep -v 'assert' | grep -v '^$' || true)"
          if [ -n "$offenders" ]; then
            echo "The public endpoint appears outside an assertion:" >&2
            echo "$offenders" >&2
            exit 1
          fi
          echo "OK: ${count} occurrence(s), every one an assertion about the default."
