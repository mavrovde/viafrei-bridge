# SonarCloud (Automatic Analysis) reads this file. Owner rule: Sonar checks the
# code that runs for users and nothing else. For this repository that is the
# bridge itself — src/, compiled into the published dist/. The CI tooling under
# scripts/, the tests and the workflows are not shipped, and are judged by their
# own self-tests and review rather than by the quality gate.
sonar.sources=src
sonar.exclusions=**/*.test.*,**/test/**
